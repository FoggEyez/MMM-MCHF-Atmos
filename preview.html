<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mischief Atmos · Synthetic preview</title><link rel="stylesheet" href="MMM-MCHF-Atmos.css"><style>html,body{margin:0;background:#0b1510;color:#e6eadf;font-family:'Segoe UI',Arial,sans-serif;height:100%}main{position:relative;z-index:10;padding:48px;max-width:650px;margin:auto}small{color:#d5bd87;letter-spacing:2px}h1{font-size:38px;font-weight:400}p{color:#a8bcac}select,input{font:inherit;background:#24372a;border:1px solid #5b705b;color:#e7eddf;padding:10px;margin:8px}label{display:block}#status{color:#d5bd87;margin-top:25px}.demo-card{border:1px solid #506045;background:#223026;padding:25px;border-radius:14px;margin-top:35px}.demo-card h2{margin:0 0 15px;font-weight:400}[hidden]{display:none!important}</style></head><body><main><small>MIRROR MISCHIEF · MCHF ATMOS</small><h1>A little atmosphere.</h1><p>Synthetic demonstration · no weather provider calls.</p><label>Preview condition<select id="condition"><option value="rain">Rain</option><option value="snow">Snow</option><option value="frost">Freezing conditions</option><option value="heat">Hot conditions</option><option value="thunder">Thunderstorm</option><option value="unavailable">Stale / unavailable data</option></select></label><label>Movement<select id="motion"><option value="auto">Smooth</option><option value="gentle">Gentle</option><option value="still">Still</option></select></label><label><input id="lightning" type="checkbox"> Include slow edge lightning in thunderstorms</label><div class="demo-card"><h2>Your modules stay readable.</h2><p>Weather detail stays around the edges. Choose which effects to enable and how strong they should be.</p></div><p id="status" role="status"></p></main><div id="effects" aria-hidden="true"></div><script src="weather-model.js"></script><script src="weather-renderer.js"></script><script src="preview.js"></script></body></html>
